# nginx server block for the POS app (pos.xentraerp.net).
#
# The Vue app is a static SPA build (pos-frontend/dist) — it has no server
# of its own. Its API calls (/api/resource, /api/method, /api/erp) are
# same-origin relative paths that this config forwards to the SAME
# erp-frontend Next.js process already running on :8083, which already
# resolves the correct tenant site purely from the `xentra_tenant` cookie
# (see erp-frontend/src/lib/tenancy/registry.ts) — no new backend process,
# no CORS, nothing tenant-specific to configure here.
#
# Install: copy/symlink into /etc/nginx/sites-available/, then
# `ln -s` into sites-enabled/, `nginx -t`, `systemctl reload nginx`.
# Build the app first: cd pos-frontend && npm install && npm run build
# (output lands in pos-frontend/dist — update `root` below if that path
# differs on the server).

server {
    listen 80;
    server_name pos.xentraerp.net;

    # Redirect to HTTPS once a cert is issued for this hostname (certbot
    # --nginx -d pos.xentraerp.net, or however TLS is provisioned for the
    # other xentraerp.net hostnames) — left as a plain HTTP block until then
    # so this can be installed and tested before TLS is wired up.
    # return 301 https://$host$request_uri;

    root /home/xentraerp/pos-frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — any non-API, non-file path serves index.html so
    # Vue Router's history mode (no hash) works on a hard refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
