# POS app: static Vue build served directly; its /api/* calls go to the same
# Next.js process that already resolves the tenant from the xentra_tenant cookie.
server {
    listen 80;
    server_name pos.xentraerp.net;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name pos.xentraerp.net;

    ssl_certificate /etc/letsencrypt/live/pos.xentraerp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.xentraerp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/xentraerp/pos-frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The real client address — nginx always overwrites this, so it can't be spoofed.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached hard; the HTML shell must not be.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA fallback so a hard refresh on /floor or /order/... works.
    location / { try_files $uri $uri/ /index.html; }
}
