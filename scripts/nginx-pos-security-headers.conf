# POS upgrade Phase 1 — security headers for pos.xentraerp.net.
#
# Install: cp scripts/nginx-pos-security-headers.conf /etc/nginx/snippets/pos-security-headers.conf
#
# nginx gotcha: a `location` that has ANY add_header of its own does NOT inherit the
# server-level add_header lines. So this file is included at server level AND inside every
# location that sets its own header (see scripts/nginx-pos.xentraerp.net.conf).
#
# CSP notes (matched to the Vue build):
#  - scripts: only same-origin bundles (no inline scripts; the connect fallback is
#    /connect-fallback.js, the receipt print window has no inline script);
#  - styles: same-origin + 'unsafe-inline' (Vue style bindings and a few style attributes);
#  - fonts: self-hosted (no Google Fonts);
#  - img: data: for the authenticator QR code, blob: for generated images;
#  - frames: same-origin about:blank iframes are used for kitchen ticket printing;
#  - connect: same-origin /api only.
# HSTS starts at 1 day; raise to 31536000 after a week without problems. Do NOT add
# `preload` unless every xentraerp.net subdomain is HTTPS-only.
add_header Strict-Transport-Security "max-age=86400" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(self), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
