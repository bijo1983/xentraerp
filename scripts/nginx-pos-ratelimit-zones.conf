# POS upgrade Phase 1 — rate-limit zones for pos.xentraerp.net (nginx `http {}` context).
#
# Install (as root, once):
#   cp scripts/nginx-pos-ratelimit-zones.conf /etc/nginx/conf.d/pos-ratelimit-zones.conf
# conf.d/*.conf is included inside `http {}` by the stock Ubuntu nginx.conf. Then install
# scripts/nginx-pos-security.conf (see its header), `nginx -t`, and `systemctl reload nginx`.
#
# Keyed on the client address nginx sees ($binary_remote_addr). A shop behind one NAT
# shares a bucket, so the limits are generous for humans and tight for scripts; the
# backend has its own per-user / per-IP progressive lockout on top (pos_auth).

# Staff PIN, management and unlock sign-ins: 10 per minute per IP, bursts of 5.
limit_req_zone $binary_remote_addr zone=pos_login:10m rate=10r/m;
# Organization-code lookups and device registration: 20 per minute per IP.
limit_req_zone $binary_remote_addr zone=pos_lookup:10m rate=20r/m;
