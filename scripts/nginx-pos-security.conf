# POS upgrade Phase 1 — server-level security include for pos.xentraerp.net:
# security headers + rate limits on the sign-in endpoints.
#
# Install (as root; nothing here is applied automatically):
#   1. cp scripts/nginx-pos-ratelimit-zones.conf   /etc/nginx/conf.d/pos-ratelimit-zones.conf
#   2. cp scripts/nginx-pos-security-headers.conf  /etc/nginx/snippets/pos-security-headers.conf
#   3. cp scripts/nginx-pos-security.conf          /etc/nginx/snippets/pos-security.conf
#   4. Replace /etc/nginx/sites-available/pos.xentraerp.net with
#      scripts/nginx-pos.xentraerp.net.conf (it includes the two snippets), keeping a backup:
#        cp /etc/nginx/sites-available/pos.xentraerp.net /root/pos.nginx.bak-$(date +%s)
#   5. nginx -t && systemctl reload nginx
#   6. Check: curl -sI https://pos.xentraerp.net/ | grep -iE 'strict|content-security|x-frame|referrer|permissions'
#      and that sign-in still works (organization code, PIN pad, management sign-in).
# Rollback: restore the backup from step 4 and `nginx -t && systemctl reload nginx`.
#
# Must be included inside the `server { listen 443 ... }` block of pos.xentraerp.net.

include /etc/nginx/snippets/pos-security-headers.conf;

limit_req_status 429;
limit_req_log_level warn;

# Sign-in endpoints: exact-match locations so only these are throttled. Same upstream and
# headers as the general /api/ location.
location ~ ^/api/method/(custom_erp\.api\.pos_auth\.(pin_login|management_login|unlock_session)|custom_erp\.api\.pos\.pin_login|login)$ {
    limit_req zone=pos_login burst=5 nodelay;
    include /etc/nginx/snippets/pos-security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/method/(custom_erp\.api\.pos_auth\.(lookup_organization|register_device|login_context)|custom_erp\.api\.signup\.tenant_lookup)$ {
    limit_req zone=pos_lookup burst=10 nodelay;
    include /etc/nginx/snippets/pos-security-headers.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
