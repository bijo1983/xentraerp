# CLINZA clinic app (clinic-frontend/): static Vue build served directly; its /api/* calls go to
# the same erp-frontend Next.js process (:8083) as the POS, which resolves the tenant site from
# the xentra_tenant cookie. Install:
#   cp scripts/nginx-clinza-security-headers.conf /etc/nginx/snippets/clinza-security-headers.conf
#   cp scripts/nginx-clinza.xentraerp.com.conf /etc/nginx/sites-available/clinza.xentraerp.com
#   ln -s /etc/nginx/sites-available/clinza.xentraerp.com /etc/nginx/sites-enabled/
#   (first time, before the cert exists: comment out the 443 server, reload, then)
#   certbot certonly --webroot -w /var/www/html -d clinza.xentraerp.com
#   nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name clinza.xentraerp.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name clinza.xentraerp.com;

    ssl_certificate /etc/letsencrypt/live/clinza.xentraerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinza.xentraerp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/xentraerp/clinic-frontend/dist;
    index index.html;

    include /etc/nginx/snippets/clinza-security-headers.conf;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The real client address — nginx always overwrites this, so it can't be spoofed.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(private/)?files/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ { include /etc/nginx/snippets/clinza-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /index.html { include /etc/nginx/snippets/clinza-security-headers.conf; add_header Cache-Control "no-cache"; }

    # SPA fallback so a hard refresh on /patients/... or /print/... works.
    location / { try_files $uri $uri/ /index.html; }
}
