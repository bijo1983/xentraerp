# Security headers for clinza.xentraerp.net (see nginx-clinza.xentraerp.net.conf).
# Included at server level AND in every location with its own add_header (nginx doesn't
# inherit add_header into such a location). img data: = the ZATCA QR code on KSA invoices.
# accounts.google.com = "Continue with Google" on /signup (Google Identity Services script + popup).
add_header Strict-Transport-Security "max-age=86400" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src 'self' https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
