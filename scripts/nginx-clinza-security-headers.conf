# Security headers for clinza.xentraerp.com (see nginx-clinza.xentraerp.com.conf).
# Included at server level AND in every location with its own add_header (nginx doesn't
# inherit add_header into such a location). img data: = the ZATCA QR code on KSA invoices.
add_header Strict-Transport-Security "max-age=86400" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
