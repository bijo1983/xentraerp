<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>XentraERP POS</title>
    <meta name="theme-color" content="#0b1b3a" />
    <meta name="description" content="XentraERP POS — run every sale, table and store from one intelligent point of sale." />
    <!-- Fonts are self-hosted (bundled by Vite from @fontsource), so the CSP needs no third-party origin. -->
  </head>
  <body>
    <div id="app"></div>
    <!--
      Fallback shown if the Vue app hasn't mounted anything into #app within
      10s — pairs with capacitor.config.ts's SplashScreen.launchShowDuration
      (also 10s + a bit), so this becomes visible right around when the
      native splash forces itself away, instead of a bare blank/frozen
      screen with no way to recover. Plain script (public/connect-fallback.js) + inline CSS, not a Vue
      component: it has to work even if the Vue bundle itself never loads
      or errors before mounting.
    -->
    <div
      id="connect-fallback"
      style="display: none; position: fixed; inset: 0; z-index: 9999; background: #f4f6fb; color: #161b2e; font-family: system-ui, -apple-system, sans-serif; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 16px"
    >
      <div style="font-size: 17px; font-weight: 600">Taking longer than expected to connect</div>
      <div style="font-size: 13.5px; color: #5b6480; max-width: 320px">
        Check your internet connection, then try again.
      </div>
      <button
        style="padding: 12px 28px; border: 0; border-radius: 10px; background: #1776ff; color: #fff; font-weight: 600; font-size: 14.5px"
      >
        Retry
      </button>
    </div>
    <!-- External (not inline) so the Content-Security-Policy can forbid inline scripts. -->
    <script src="/connect-fallback.js" defer></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
